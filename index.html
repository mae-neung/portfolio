<!doctype html>
<html lang="ko" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="React·Next.js 프론트엔드 개발자 이강욱의 프로젝트 포트폴리오" />
    <meta name="theme-color" content="#F5F7FA" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('portfolio-theme')
          const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'default'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#101A2A' : '#F5F7FA'
        } catch { /* The light theme remains readable when storage is unavailable. */ }
      })()
    </script>
    <title>이강욱 — Frontend Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
