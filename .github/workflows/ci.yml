name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Check committed SSG output
        run: |
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: portfolio-gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and check committed SSG output
        run: |
          pnpm build
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - name: Publish to legacy gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1
          publish_dir="$(mktemp -d)"
          git worktree add --detach "$publish_dir" refs/remotes/origin/gh-pages
          git -C "$publish_dir" rm -r --ignore-unmatch .
          cp -a dist/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" add -A
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Deploy $GITHUB_SHA"
            git -C "$publish_dir" push origin HEAD:gh-pages
          fi
